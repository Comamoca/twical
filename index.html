<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>🚧 twical</title>

    <!-- for calendar ui -->
    <script type="module" src="https://unpkg.com/cally"></script>

    <!-- Uncomment this if you use the TailwindCSS integration -->
    <link rel="stylesheet" href="/priv/static/twical.min.css">
    <script type="module" src="/priv/static/twical.min.mjs"></script>
  </head>

  <body>
    <div id="app"></div>
    
    <script>
      // Debug calendar events
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
          const calendar = document.querySelector('calendar-date');
          if (calendar) {
            console.log('Calendar found:', calendar);
            
            // Listen to all possible events
            ['calendar-change', 'change', 'click', 'select', 'dateselect', 'date-change'].forEach(eventName => {
              calendar.addEventListener(eventName, (e) => {
                console.log(`Event: ${eventName}`, e);
                console.log('Event detail:', e.detail);
                console.log('Event target:', e.target);
                console.log('Target value:', e.target.value);
              });
            });
          } else {
            console.log('Calendar not found');
          }
        }, 1000);
      });
    </script>
  </body>
</html>
